<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<title>お問い合わせ｜トレ飯相棒</title>
<link rel="stylesheet" href="/legal.css">
<style>
  label{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin:14px 0 6px}
  input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-size:16px;font-weight:600;padding:12px 14px;outline:none;font-family:inherit}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:130px;resize:vertical}
  button{width:100%;margin-top:16px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;
    padding:14px;border:none;border-radius:12px;cursor:pointer}
  .or{text-align:center;color:var(--dim);font-size:12px;margin:20px 0 6px}
</style>
<div class="wrap">
  <div class="logo">トレ飯<b>相棒</b></div>
  <a class="back" href="/">← アプリに戻る</a>
  <h1>お問い合わせ</h1>
  <p class="lead">ご意見・不具合報告・その他のご連絡はこちらから。</p>

  <!-- 送信フォーム: Formspree等の無料フォームサービスの送信先URLを action に設定すると有効化されます（README参照） -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="email">メールアドレス（返信が必要な場合）</label>
    <input id="email" type="email" name="email" placeholder="you@example.com">
    <label for="msg">お問い合わせ内容</label>
    <textarea id="msg" name="message" required placeholder="ご自由にご記入ください"></textarea>
    <button type="submit">送信する</button>
  </form>

  <p class="or">または メールで直接：</p>
  <p style="text-align:center"><a class="btn" href="mailto:contact@mainichi-lab.com">contact@mainichi-lab.com にメール</a></p>

  <p class="muted">通常、数日以内に確認します。返信をご希望の場合はメールアドレスのご記入をお願いします。<br>
    <a href="/privacy.html">プライバシーポリシー</a>・<a href="/about.html">運営者情報</a></p>
</div>
</html>
